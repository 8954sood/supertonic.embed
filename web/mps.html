<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supertonic · Mac MPS 스타일 추출</title>
<style>
body{font:16px/1.7 system-ui,sans-serif;max-width:800px;margin:48px auto;padding:0 24px;background:#10151b;color:#e6edf3}h1{line-height:1.3}label{display:block;margin:20px 0}input{font:inherit;background:#1d2733;color:inherit;border:1px solid #526276;padding:8px;max-width:100%}button,a{font:inherit;background:#8be4bc;color:#10281d;border:0;border-radius:7px;padding:10px 18px;margin:4px;cursor:pointer}button:disabled{opacity:.4}pre{background:#1d2733;padding:16px;white-space:pre-wrap;max-height:260px;overflow:auto}.note{color:#b9c7d5}audio{display:block;width:100%;margin-top:16px}#downloads{display:flex;flex-wrap:wrap}
</style>
<h1>Mac MPS 목소리 스타일 추출</h1>
<p>이 맥의 Python과 Apple GPU로 계산합니다. 실제 역전파로 음색을 최적화하고, 전체 5문장 평균 손실로 결과를 확인합니다.</p>
<p class="note">음성은 이 맥의 로컬 서버로만 전달됩니다. 첫 실행에는 모델 다운로드가 필요할 수 있습니다. 실험용이며, 목표 손실 도달과 목소리 품질은 보장되지 않습니다. 사용 권한이 있는 음성을 선택하세요.</p>
<label>참조 음성 (0.3–15초, 최대 32 MB) <input id="audio" type="file" accept="audio/*"></label>
<label>음색 최대 갱신 횟수 (0 = 손실 0.24 이하까지 무제한) <input id="iterations" type="number" min="0" max="10000" value="0"></label>
<label>속도 보정 단계별 최대 횟수 <input id="duration" type="number" min="1" max="1000" value="100"></label>
<label><input id="skip" type="checkbox"> 속도 보정 생략 (음색만 추출)</label>
<button id="start">MPS 추출 시작</button><button id="cancel" disabled>취소하고 최선 결과 유지</button>
<p id="status" role="status" aria-live="polite">음성을 선택하면 시작할 수 있습니다.</p>
<p id="metrics" class="note"></p><div id="downloads"></div><pre id="log"></pre><div id="preview"></div>
<script type="module" src="/mps.mjs"></script></html>
